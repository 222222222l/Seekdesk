<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="referrer" content="no-referrer"><title>岗位审阅台</title><link rel="stylesheet" href="style.css"><script defer src="core.js"></script><script defer src="fixture.js"></script><script defer src="app.js"></script></head>
<body><header><div class="wrap"><p class="eyebrow">CAREER REVIEW DESK / 01</p><h1>岗位审阅台</h1><p>把岗位状态、适配证据、简历初稿和人工进度分开记录。</p><div class="signals"><span>本地存储</span><span>只读来源</span><span>不代投递</span></div></div></header>
<main class="wrap"><p id="banner" class="notice">未连接任何招聘平台。粘贴链接不会自动访问；只有点击链接才会打开外站。请勿录入敏感证件信息。</p>
<div class="toolbar"><button id="fixtures">载入公开样本与虚构履历</button><button id="export" class="secondary">导出本地记录</button><button id="clear" class="secondary">清除本地记录</button></div>
<p id="message" role="status"></p>
<div class="layout"><section><h2 id="form-title">新增岗位</h2><form id="job-form">
<label>公开职位链接 <input name="url" type="url" placeholder="https://…"></label><div class="row"><label>公司 <input name="employer" maxlength="150"></label><label>职位 ID <input name="roleID" maxlength="100"></label></div>
<label>职位名称 <input name="title" maxlength="180"></label><label>手工粘贴 JD <textarea name="jd" rows="5" maxlength="32000"></textarea></label><label class="check"><input name="partial" type="checkbox"> 仅有片段，完整 JD 未核验</label>
<div class="row"><label>主方向 <select name="track" id="track"></select></label><label>发布日期（可空） <input name="postedDate" type="date"></label></div>
<details><summary>添加来源观察与独立适配判断</summary>
<div class="row"><label>来源状态 <select name="observed" id="observed"></select></label><label>查看日期 <input name="date" type="date"></label></div>
<label class="check"><input name="official" type="checkbox"> 本人确认这是雇主官方来源</label><label>状态证据 <textarea name="excerpt" rows="2" maxlength="3000"></textarea></label>
<label>申请入口 <select name="intake" id="intake"></select></label><label>入口证据 <input name="intakeEvidence" maxlength="500"></label>
<label>团队增长证据（未知请留空） <input name="teamGrowth" maxlength="1000"></label>
<label>人工适配 <select name="eligibility" id="eligibility"></select></label><label>判断依据 <input name="eligibilityReason" maxlength="1000"></label>
</details>
<details><summary>岗位条款与个人证据</summary><div id="requirements"></div><button type="button" id="add-req" class="secondary">添加条款</button></details>
<div class="toolbar"><button type="submit" id="save">保存记录</button><button type="button" class="secondary" id="cancel" hidden>取消编辑</button></div></form></section>
<section><h2>机会清单 <span id="count"></span></h2><div id="filters" class="toolbar"></div><div id="records"></div></section></div>
<section class="profile"><h2>简历素材（可选）</h2><p>只为本地草稿渲染。输入会保存在当前浏览器，导出会包含该素材。不要输入敏感个人资料。</p><textarea id="profile" rows="5" maxlength="10000" aria-label="简历素材"></textarea><button id="profile-save">保存素材</button></section>
</main></body></html>
