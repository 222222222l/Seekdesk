<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f6f7f9" />
    <title>寻职 · 求职工作台</title>
    <link rel="stylesheet" href="desk.css" />
    <script defer src="backend-picker.js"></script>
    <script defer src="desk.js"></script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="#overview"
          ><i class="brand-icon" data-icon="scan"></i
          ><span>寻职 <small>Seekdesk</small></span></a
        >
        <nav aria-label="工作区">
          <div class="nav-label">工作空间</div>
          <a href="#overview" data-icon="layout">工作概览</a
          ><a href="#jobs" data-icon="briefcase">岗位机会</a
          ><a href="#activity" data-icon="message">沟通与通知</a>
          <div class="nav-label">管理</div>
          <a href="#resume" data-icon="file">我的简历</a
          ><a href="#sources" data-icon="layers">来源与账号</a
          ><a href="#settings" data-icon="sliders">模型与任务</a>
        </nav>
        <div class="side-bottom">
          <a href="/review.html" data-icon="archive"
            >人工审阅台 <span>↗</span></a
          >
          <div class="workspace">
            <span class="avatar">求</span>
            <div><b>个人工作区</b><small>本机存储</small></div>
          </div>
        </div>
      </aside>
      <main>
        <div class="topbar">
          <span
            ><i data-icon="panel"></i> 个人工作区 <em>/</em>
            <strong id="crumb">工作概览</strong></span
          ><span class="online" id="online">连接中</span>
        </div>
        <div class="content">
          <header class="page-head">
            <div>
              <h1 id="heading">工作概览</h1>
              <p id="subtitle"></p>
            </div>
            <span id="dateline"></span>
          </header>
          <div id="view" aria-live="off"><p>正在读取工作台…</p></div>
        </div>
      </main>
    </div>
    <div id="toast" role="status" hidden></div>
    <dialog id="detail">
      <div class="dialog-head">
        <b>岗位详情</b
        ><button type="button" id="close-detail" aria-label="关闭">×</button>
      </div>
      <div id="detail-body"></div>
    </dialog>
  </body>
</html>
